[package]
name = "walkupie"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A tiny always-on-top break timer for developers"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.25"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"